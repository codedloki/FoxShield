[project]
name = "foxshield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prashik Jadhav", email = "prashikjadhav17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.16",
    "streamlit>=1.64.0",
]

[project.scripts]
foxshield = "foxshield:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
