[project]
name = "foxshield"
version = "0.2.0"
description = "ContextShield: offline-first contextual privacy-leak scanner for public-sector documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "streamlit>=1.42,<2",
  "requests>=2.32,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "PyMuPDF>=1.25,<2",
  "pdfplumber>=0.11,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "presidio-analyzer>=2.2.364,<3",
  "spacy>=3.8,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<1", "Pillow>=11,<12"]

test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
